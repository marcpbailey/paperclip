services:
  server:
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      OPENROUTER_LIGHT_MODEL: "${OPENROUTER_LIGHT_MODEL:-}"
      GH_TOKEN: "${GH_TOKEN}"
#      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
#      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
#      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
#      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}"
#      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}"
#      ANTHROPIC_DEFAULT_OPUS_MODEL: "${ANTHROPIC_DEFAULT_OPUS_MODEL:-}"
    volumes:
      - ../local/COMMON_AGENTS.md:/paperclip/AGENTS.md:ro
      - ../local/skills/agent-rollcall:/app/skills/agent-rollcall:ro
      - ../local/skills/trace-issue-run:/app/skills/trace-issue-run:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  paperclip-data:
    external: true
    name: docker_paperclip-data
  pgdata:
    external: true
    name: docker_pgdata
